# OpenAPI 3.1 – API gọi model suy ra home / office từ GPS.
# Server serve đúng một model; tham số lấy từ config của model đó, client không chọn version.

openapi: 3.1.0

info:
  title: GeoLife Home/Office API
  version: 1.0.0
  description: |
    Suy ra home và office của một user kèm confidence. Client chỉ gửi `userId`; server lấy điểm GPS của user đó trong DB
    (`POST /users/{userId}/predictions`).

    Quy ước:
    - Thời gian theo ISO 8601, có offset (`2008-10-23T02:53:04Z`).
    - Toạ độ WGS84, độ thập phân.
    - Lỗi trả về dạng `{ "error": { "code", "message" } }`.
    - Mỗi response có `model` (tên và version của model đang serve) để biết kết quả đến từ đâu.
    - Xác thực bằng OAuth2 / OpenID Connect: client gửi ID token trong header `Authorization: Bearer <token>`.

    **Dự đoán và abstain.** Với mỗi role (`home`, `office`), model hoặc trả một place, hoặc từ chối dự đoán (abstain)
    kèm lý do. Hai dạng loại trừ nhau: dự đoán luôn có toạ độ và `confidence`; abstain chỉ có `abstain_reason`.

    **Không đủ dữ liệu không phải là lỗi.** User có điểm GPS trong khoảng thời gian yêu cầu nhưng quá ít (vd. vài điểm,
    chỉ đang di chuyển, chưa đủ số đêm) vẫn trả `200`, với role tương ứng là abstain. Lỗi `4xx` chỉ dành cho request sai
    hoặc không có điểm nào để chạy.

    | Lý do abstain | Role | Ý nghĩa |
    | --- | --- | --- |
    | `no_night_stay` | home | Không có lần ở lại nào rơi vào khung đêm (gồm cả khi không tạo được lần ở lại nào) |
    | `insufficient_nights` | home | Có ở lại ban đêm nhưng không place nào đủ số đêm tối thiểu |
    | `no_distinct_office` | office | Không có place nào có giờ trong khung hành chính của ngày làm việc và cách home đủ xa |
    | `insufficient_workdays` | office | Có place ứng viên nhưng không place nào đủ số ngày làm việc tối thiểu |

    **Confidence không phải xác suất đúng.** GeoLife không có nhãn home / office nên không đo được accuracy. Confidence đo
    **độ ổn định**: lấy mẫu lại các tuần dữ liệu của user (200 lần), chọn lại home / office theo đúng luật của model, và
    đếm tỉ lệ lần chọn ra cùng place. User ít tuần dữ liệu cho confidence dao động mạnh; đọc kèm `days` và `regularity`.

servers:
  - url: http://localhost:8000/v1
    description: Version của API nằm trong đường dẫn; đổi contract không tương thích thì lên /v2

security:
  - googleOidc: []

paths:
  /health:
    get:
      summary: Kiểm tra dịch vụ, model và DB đã sẵn sàng chưa
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Sẵn sàng nhận request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                model_loaded: true
                db_connected: true
        "503":
          description: Model chưa nạp xong hoặc mất kết nối DB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: unavailable
                model_loaded: true
                db_connected: false

  /users/{userId}/predictions:
    post:
      summary: Chạy model trên dữ liệu GPS của user trong DB
      operationId: predictUser
      description: |
        Server truy vấn điểm GPS của user trong DB (lọc theo `start`, `end` nếu có), chạy pipeline
        (stay -> place -> home / office) và trả kết quả. Request không có body.
        Không truyền khoảng thời gian thì dùng toàn bộ dữ liệu của user. `start` phải trước `end` (nếu không: `400`).
        User không có trong DB, hoặc không có điểm nào trong khoảng thời gian: `404`. Có điểm nhưng không đủ để dự đoán:
        `200` kèm abstain.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UserId"
        - name: start
          in: query
          description: Chỉ lấy điểm từ thời điểm này
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: Chỉ lấy điểm trước thời điểm này
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Kết quả home / office của user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPrediction"
              examples:
                predicted:
                  $ref: "#/components/examples/UserPrediction"
                notEnoughData:
                  $ref: "#/components/examples/UserPredictionAbstain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    googleOidc:
      type: openIdConnect
      openIdConnectUrl: https://accounts.google.com/.well-known/openid-configuration
      description: |
        Đăng nhập bằng Google (OAuth2 authorization code + PKCE, scope `openid email`) để lấy ID token, rồi gửi token đó
        trong header `Authorization: Bearer <token>`. Server kiểm chữ ký, `iss`, `aud`, `exp` của token (sai: `401`) và
        kiểm tài khoản có nằm trong danh sách được phép gọi API không (không: `403`).

  schemas:
    UserId:
      type: integer
      minimum: 0
      example: 5

    Health:
      type: object
      required: [status, model_loaded, db_connected]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        model_loaded:
          type: boolean
        db_connected:
          type: boolean

    HomeResult:
      description: Kết quả cho home. Hoặc dự đoán, hoặc abstain.
      oneOf:
        - $ref: "#/components/schemas/PlacePrediction"
        - type: object
          title: HomeAbstain
          required: [abstain_reason]
          additionalProperties: false
          properties:
            abstain_reason:
              type: string
              enum: [no_night_stay, insufficient_nights]

    OfficeResult:
      description: Kết quả cho office. Hoặc dự đoán, hoặc abstain.
      oneOf:
        - $ref: "#/components/schemas/PlacePrediction"
        - type: object
          title: OfficeAbstain
          required: [abstain_reason]
          additionalProperties: false
          properties:
            abstain_reason:
              type: string
              enum: [no_distinct_office, insufficient_workdays]

    PlacePrediction:
      type: object
      description: Một place được dự đoán là home hoặc office.
      required: [lat, lon, hours, days, confidence, regularity, margin]
      additionalProperties: false
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Tâm của place, trung bình theo thời gian ở lại
        lon:
          type: number
          minimum: -180
          maximum: 180
        hours:
          type: number
          minimum: 0
          description: Tổng giờ ở place trong khung giờ của role (khung đêm cho home, khung hành chính của ngày làm việc cho office)
        days:
          type: integer
          minimum: 1
          description: Số đêm (home) / ngày làm việc (office) khác nhau có mặt ở place
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Tỉ lệ trong 200 lần lấy mẫu lại theo tuần mà model chọn ra đúng place này. Đo độ ổn định của dự đoán,
            không phải xác suất đúng.
        regularity:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Số đêm (ngày làm việc) ở place này / số đêm (ngày làm việc) khác nhau có stay được phát hiện trong khung giờ đó,
            ở bất kỳ place nào. Đêm có GPS nhưng không có stay (đang di chuyển, tín hiệu thưa) không tính vào mẫu số:
            vd. 10 đêm có GPS, chỉ 2 đêm có stay và cả hai ở place này thì regularity = 1.
        margin:
          type: number
          minimum: 0
          maximum: 1
          description: |
            (giờ của place này − giờ của place đứng thứ hai) / giờ của place này, trong các place đủ điều kiện.
            Gần 0: có một place khác gần như ngang ngửa. Chỉ có một place đủ điều kiện thì = 1.

    ModelInfo:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          example: stay_point
        version:
          type: integer
          example: 1

    Prediction:
      type: object
      required: [model, home, office]
      properties:
        model:
          $ref: "#/components/schemas/ModelInfo"
        home:
          $ref: "#/components/schemas/HomeResult"
        office:
          $ref: "#/components/schemas/OfficeResult"

    UserPrediction:
      allOf:
        - type: object
          required: [user_id, n_points, time_range]
          properties:
            user_id:
              $ref: "#/components/schemas/UserId"
            n_points:
              type: integer
              description: Số điểm GPS lấy từ DB để chạy model
            time_range:
              type: object
              description: Thời điểm của điểm đầu và điểm cuối thực sự được dùng
              required: [start, end]
              properties:
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
        - $ref: "#/components/schemas/Prediction"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, invalid_time_range, unauthorized, forbidden, user_not_found, no_points,
                     model_unavailable, db_unavailable, internal_error]
            message:
              type: string
              description: Mô tả cho người đọc; client chỉ nên rẽ nhánh theo `code`

  responses:
    BadRequest:
      description: |
        Request không hợp lệ: `userId` không phải số nguyên không âm, hoặc `start` / `end` sai định dạng thời gian
        (`invalid_request`); `start` không trước `end` (`invalid_time_range`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalidRequest:
              value:
                error: { code: invalid_request, message: "start must be an ISO 8601 date-time with offset" }
            invalidTimeRange:
              value:
                error: { code: invalid_time_range, message: "start must be before end" }
    Unauthorized:
      description: Thiếu token, token sai chữ ký, sai `iss` / `aud`, hoặc đã hết hạn
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: unauthorized, message: "missing or invalid bearer token" }
    Forbidden:
      description: Token hợp lệ nhưng tài khoản không nằm trong danh sách được phép gọi API
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: forbidden, message: "account is not allowed to call this API" }
    NotFound:
      description: User không có trong DB (`user_not_found`), hoặc không có điểm nào trong khoảng thời gian yêu cầu (`no_points`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            userNotFound:
              value:
                error: { code: user_not_found, message: "user 999 not found" }
            noPoints:
              value:
                error: { code: no_points, message: "user 5 has no points between 2010-01-01T00:00:00Z and 2010-02-01T00:00:00Z" }
    Unavailable:
      description: Model chưa nạp xong (`model_unavailable`) hoặc mất kết nối DB (`db_unavailable`); thử lại sau
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            modelLoading:
              value:
                error: { code: model_unavailable, message: "model is loading" }
            dbDown:
              value:
                error: { code: db_unavailable, message: "database is unavailable" }
    InternalError:
      description: Lỗi không lường trước trong server; không trả chi tiết nội bộ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: internal_error, message: "unexpected error" }

  examples:
    UserPrediction:
      summary: Có dự đoán cho cả home và office (user 5, toàn bộ dữ liệu, stay_point v1)
      value:
        user_id: 5
        n_points: 109040
        time_range:
          start: "2008-10-24T04:12:30Z"
          end: "2009-03-19T05:46:37Z"
        model: { name: stay_point, version: 1 }
        home:
          lat: 40.0106879
          lon: 116.3219049
          hours: 115.43
          days: 25
          confidence: 0.55
          regularity: 0.676
          margin: 0.001
        office:
          lat: 40.0002048
          lon: 116.3269257
          hours: 76.07
          days: 18
          confidence: 0.55
          regularity: 0.667
          margin: 0.976
    UserPredictionAbstain:
      summary: |
        Có điểm nhưng không đủ để dự đoán: user 5, chỉ một ngày, không ở lại qua đêm
        (`?start=2008-11-10T00:00:00Z&end=2008-11-11T00:00:00Z`, stay_point v1)
      value:
        user_id: 5
        n_points: 987
        time_range:
          start: "2008-11-10T07:51:39Z"
          end: "2008-11-10T12:26:47Z"
        model: { name: stay_point, version: 1 }
        home:
          abstain_reason: no_night_stay
        office:
          abstain_reason: insufficient_workdays
