# OpenAPI 3.1 – API gọi model suy ra home / office từ GPS.
# Server serve đúng một model; tham số lấy từ config của model đó, client không chọn version.

openapi: 3.1.0

info:
  title: GeoLife Home/Office API
  version: 1.0.0
  description: |
    Suy ra home và office kèm confidence, theo hai cách:

    - `POST /predict`: client tự gửi điểm GPS.
    - `POST /users/{userId}/predictions`: server lấy điểm GPS của user trong DB.

    Quy ước:
    - Thời gian theo ISO 8601, có offset (`2008-10-23T02:53:04Z`).
    - Toạ độ WGS84, độ thập phân.
    - Lỗi trả về dạng `{ "error": { "code", "message" } }`.
    - Mỗi response có `model` (tên và version của model đang serve) để biết kết quả đến từ đâu.

    **Dự đoán và abstain.** Với mỗi role (`home`, `office`), model hoặc trả một place, hoặc từ chối dự đoán (abstain)
    kèm lý do. Hai dạng loại trừ nhau: dự đoán luôn có toạ độ và `confidence`; abstain chỉ có `abstain_reason`.

    **Không đủ dữ liệu không phải là lỗi.** Điểm GPS hợp lệ nhưng quá ít (vd. vài điểm, chỉ đang di chuyển, chưa đủ số
    đêm) vẫn trả `200`, với role tương ứng là abstain. Lỗi `4xx` chỉ dành cho request sai hoặc không có điểm nào để chạy.

    | Lý do abstain | Role | Ý nghĩa |
    | --- | --- | --- |
    | `no_night_stay` | home | Không có lần ở lại nào rơi vào khung đêm (gồm cả khi không tạo được lần ở lại nào) |
    | `insufficient_nights` | home | Có ở lại ban đêm nhưng không place nào đủ số đêm tối thiểu |
    | `no_distinct_office` | office | Không có place nào có giờ trong khung hành chính của ngày làm việc và cách home đủ xa |
    | `insufficient_workdays` | office | Có place ứng viên nhưng không place nào đủ số ngày làm việc tối thiểu |

    **Confidence không phải xác suất đúng.** GeoLife không có nhãn home / office nên không đo được accuracy. Confidence đo
    **độ ổn định**: lấy mẫu lại các tuần dữ liệu của user (200 lần), chọn lại home / office theo đúng luật của model, và
    đếm tỉ lệ lần chọn ra cùng place. User ít tuần dữ liệu cho confidence dao động mạnh; đọc kèm `days` và `regularity`.

servers:
  - url: http://localhost:8000/v1
    description: Version của API nằm trong đường dẫn; đổi contract không tương thích thì lên /v2

security:
  - apiKeyAuth: []

paths:
  /health:
    get:
      summary: Kiểm tra dịch vụ, model và DB đã sẵn sàng chưa
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Sẵn sàng nhận request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                model_loaded: true
                db_connected: true
        "503":
          description: Model chưa nạp xong hoặc mất kết nối DB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: unavailable
                model_loaded: true
                db_connected: false

  /predict:
    post:
      summary: Chạy model trên loạt điểm GPS gửi lên
      operationId: predict
      description: |
        Chạy toàn bộ pipeline (preprocess -> stay -> place -> home / office) trên các điểm trong body. Không đọc hay ghi DB.
        Mọi điểm được coi là của cùng một người. Thứ tự điểm không quan trọng: server sort theo thời gian; điểm trùng
        thời gian và điểm nhiễu được xử lý như preprocess.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictRequest"
            example:
              points:
                - { time: "2008-10-23T02:53:04Z", lat: 39.984702, lon: 116.318417 }
                - { time: "2008-10-23T02:53:10Z", lat: 39.984683, lon: 116.318450 }
      responses:
        "200":
          description: Kết quả home / office
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
              examples:
                predicted:
                  $ref: "#/components/examples/Prediction"
                notEnoughData:
                  $ref: "#/components/examples/PredictionAbstain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /users/{userId}/predictions:
    post:
      summary: Chạy model trên dữ liệu GPS của user trong DB
      operationId: predictUser
      description: |
        Server truy vấn điểm GPS của user trong DB (lọc theo `start`, `end` nếu có), chạy pipeline và trả kết quả.
        Không truyền khoảng thời gian thì dùng toàn bộ dữ liệu của user. `start` phải trước `end` (nếu không: `400`).
        User không có trong DB, hoặc không có điểm nào trong khoảng thời gian: `404`. Có điểm nhưng không đủ để dự đoán:
        `200` kèm abstain.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UserId"
        - name: start
          in: query
          description: Chỉ lấy điểm từ thời điểm này
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: Chỉ lấy điểm trước thời điểm này
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Kết quả home / office của user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPrediction"
              examples:
                user5:
                  $ref: "#/components/examples/UserPrediction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    UserId:
      type: integer
      minimum: 0
      example: 5

    Health:
      type: object
      required: [status, model_loaded, db_connected]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        model_loaded:
          type: boolean
        db_connected:
          type: boolean

    GpsPoint:
      type: object
      required: [time, lat, lon]
      properties:
        time:
          type: string
          format: date-time
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180

    PredictRequest:
      type: object
      required: [points]
      properties:
        points:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GpsPoint"

    HomeResult:
      description: Kết quả cho home. Hoặc dự đoán, hoặc abstain.
      oneOf:
        - $ref: "#/components/schemas/PlacePrediction"
        - type: object
          title: HomeAbstain
          required: [abstain_reason]
          additionalProperties: false
          properties:
            abstain_reason:
              type: string
              enum: [no_night_stay, insufficient_nights]

    OfficeResult:
      description: Kết quả cho office. Hoặc dự đoán, hoặc abstain.
      oneOf:
        - $ref: "#/components/schemas/PlacePrediction"
        - type: object
          title: OfficeAbstain
          required: [abstain_reason]
          additionalProperties: false
          properties:
            abstain_reason:
              type: string
              enum: [no_distinct_office, insufficient_workdays]

    PlacePrediction:
      type: object
      description: Một place được dự đoán là home hoặc office.
      required: [lat, lon, hours, days, confidence, regularity, margin]
      additionalProperties: false
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Tâm của place, trung bình theo thời gian ở lại
        lon:
          type: number
          minimum: -180
          maximum: 180
        hours:
          type: number
          minimum: 0
          description: Tổng giờ ở place trong khung giờ của role (khung đêm cho home, khung hành chính của ngày làm việc cho office)
        days:
          type: integer
          minimum: 1
          description: Số đêm (home) / ngày làm việc (office) khác nhau có mặt ở place
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Tỉ lệ trong 200 lần lấy mẫu lại theo tuần mà model chọn ra đúng place này. Đo độ ổn định của dự đoán,
            không phải xác suất đúng.
        regularity:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Số đêm (ngày làm việc) ở place này / số đêm (ngày làm việc) khác nhau có stay được phát hiện trong khung giờ đó,
            ở bất kỳ place nào. Đêm có GPS nhưng không có stay (đang di chuyển, tín hiệu thưa) không tính vào mẫu số:
            vd. 10 đêm có GPS, chỉ 2 đêm có stay và cả hai ở place này thì regularity = 1.
        margin:
          type: number
          minimum: 0
          maximum: 1
          description: |
            (giờ của place này − giờ của place đứng thứ hai) / giờ của place này, trong các place đủ điều kiện.
            Gần 0: có một place khác gần như ngang ngửa. Chỉ có một place đủ điều kiện thì = 1.

    ModelInfo:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          example: stay_point
        version:
          type: integer
          example: 2

    Prediction:
      type: object
      required: [model, home, office]
      properties:
        model:
          $ref: "#/components/schemas/ModelInfo"
        home:
          $ref: "#/components/schemas/HomeResult"
        office:
          $ref: "#/components/schemas/OfficeResult"

    UserPrediction:
      allOf:
        - type: object
          required: [user_id, n_points, time_range]
          properties:
            user_id:
              $ref: "#/components/schemas/UserId"
            n_points:
              type: integer
              description: Số điểm GPS lấy từ DB để chạy model
            time_range:
              type: object
              required: [start, end]
              properties:
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
        - $ref: "#/components/schemas/Prediction"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, invalid_point, invalid_time_range, unauthorized, user_not_found, no_points,
                     model_unavailable, internal_error]
            message:
              type: string
              description: Mô tả cho người đọc; client chỉ nên rẽ nhánh theo `code`

  responses:
    BadRequest:
      description: |
        Request không hợp lệ: body sai định dạng hoặc rỗng (`invalid_request`), một điểm sai kiểu / ngoài miền giá trị
        (`invalid_point`), `start` không trước `end` (`invalid_time_range`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalidPoint:
              value:
                error: { code: invalid_point, message: "points[12].lat must be <= 90" }
            emptyPoints:
              value:
                error: { code: invalid_request, message: "points must contain at least 1 item" }
    Unauthorized:
      description: Thiếu hoặc sai API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: unauthorized, message: "missing or invalid X-API-Key" }
    NotFound:
      description: User không có trong DB (`user_not_found`), hoặc không có điểm nào trong khoảng thời gian yêu cầu (`no_points`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            userNotFound:
              value:
                error: { code: user_not_found, message: "user 999 not found" }
            noPoints:
              value:
                error: { code: no_points, message: "user 5 has no points between 2010-01-01T00:00:00Z and 2010-02-01T00:00:00Z" }
    Unavailable:
      description: Model chưa nạp xong hoặc mất kết nối DB; thử lại sau
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: model_unavailable, message: "model is loading" }
    InternalError:
      description: Lỗi không lường trước trong server; không trả chi tiết nội bộ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: { code: internal_error, message: "unexpected error" }

  examples:
    Prediction:
      summary: Có dự đoán cho cả home và office (user 5, stay_point v2, holdout)
      value:
        model: { name: stay_point, version: 2 }
        home:
          lat: 40.0001537
          lon: 116.3267473
          hours: 115.44
          days: 23
          confidence: 0.535
          regularity: 0.622
          margin: 0.070
        office:
          lat: 40.0103650
          lon: 116.3220908
          hours: 53.85
          days: 17
          confidence: 0.535
          regularity: 0.630
          margin: 1.0
    PredictionAbstain:
      summary: Điểm hợp lệ nhưng không đủ dữ liệu (vd. một ngày, không ở lại qua đêm)
      value:
        model: { name: stay_point, version: 2 }
        home:
          abstain_reason: no_night_stay
        office:
          abstain_reason: insufficient_workdays
    UserPrediction:
      value:
        user_id: 5
        n_points: 108607
        time_range:
          start: "2008-10-23T02:53:04Z"
          end: "2009-07-05T09:12:37Z"
        model: { name: stay_point, version: 2 }
        home:
          lat: 40.0001537
          lon: 116.3267473
          hours: 115.44
          days: 23
          confidence: 0.535
          regularity: 0.622
          margin: 0.070
        office:
          lat: 40.0103650
          lon: 116.3220908
          hours: 53.85
          days: 17
          confidence: 0.535
          regularity: 0.630
          margin: 1.0
