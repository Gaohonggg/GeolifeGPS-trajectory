# Preprocess v_1: làm sạch điểm GPS + chia dev/holdout theo nhóm user.
# Lý do và bằng chứng của từng tham số: docs/preprocess_v1.md; số liệu tái lập bằng preprocess.ipynb (cùng thư mục).
# Output của một version là bất biến khi đã có model dùng nó: đổi tham số -> tạo v_2.

version: 1
seed: 42

validity:
  lat_range: [-90, 90]
  lon_range: [-180, 180]
  years: [2007, 2012]          # thời gian thu thập của GeoLife (User Guide 1.3); 3 điểm năm 2000 là lỗi đồng hồ

flight:
  traj_median_speed_kmh: 300   # loại cả file; median theo file có khoảng trống 250–450 km/h

spike:                         # B là spike nếu A->B và B->C > speed_kmh và d(A,C) < return_ratio * d(A,B)
  speed_kmh: 150
  return_ratio: 0.3
  max_iter: 3

corrupted_traj:                # loại cả file khi spike vừa nhiều vừa dày (AND)
  min_spike_ratio: 0.01
  min_spikes: 10

island:                        # điểm không có liên kết hợp lý nào mà có bước nhảy > speed_kmh: xoá; bước nhảy giữa hai đoạn dài: giữ
  speed_kmh: 400
  gap_s: 300                   # khoảng không ghi > 5 phút cũng là ranh giới đoạn
  max_points: 1

timezone:
  coord_round: 4               # ~11 m

duplicates:
  colocation_minute: 1         # cặp user cùng có mặt trong ô ~100 m ở cùng phút
  colocation_cell_deg: 0.001
  colocation_min_share: 0.1    # >= 10% thời gian có dữ liệu của user ít dữ liệu hơn -> gộp chung nhóm

split:
  holdout_frac: 0.3
  max_holdout_group_share: 0.05   # nhóm chiếm > 5% số điểm bị ép vào dev
  n_strata: 3                     # phân tầng theo số ngày có dữ liệu
