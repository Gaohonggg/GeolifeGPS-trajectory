# Stack local: Postgres + API (model nạp từ Databricks). Chạy qua Makefile, biến lấy từ .env ở gốc repo.
name: geolife

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: geolife
      POSTGRES_USER: geolife
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geolife -d geolife"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: geolife-api:local
    environment:
      DATABASE_URL: postgresql://geolife:${POSTGRES_PASSWORD}@postgres:5432/geolife
      MLFLOW_TRACKING_URI: databricks
      MLFLOW_REGISTRY_URI: databricks-uc
      DATABRICKS_HOST: ${DATABRICKS_HOST:?set DATABRICKS_HOST in .env}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:?set DATABRICKS_TOKEN in .env}
      MODEL_URI: ${MODEL_URI:?set MODEL_URI in .env}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  postgres:
