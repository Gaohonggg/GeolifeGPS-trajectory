[project]
name = "geolife-trajectory"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Thư viện mà thuật toán (src/geolife: models, home_office, confidence) cần để chạy.
dependencies = [
    "holidays>=0.107",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "timezonefinder>=9.2.0",
    "tzdata>=2026.6",
]

[dependency-groups]
# EDA, preprocess, tuning: notebook và vẽ hình
analysis = [
    "folium>=0.20.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]
# API (src/geolife_api) và đăng ký model vào MLflow
serving = [
    "fastapi>=0.162.5",
    "mlflow-skinny>=3.18.0",
    "psycopg[binary]>=3.3.8",
    "psycopg-pool>=3.3.3",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
    "schemathesis>=4.33.2",
]

[tool.uv]
# `uv sync` ở máy local cài đủ mọi nhóm; image của API chỉ cài `serving` (docker/api.Dockerfile)
default-groups = ["analysis", "serving", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: chạy lại model trên toàn bộ dữ liệu", "integration: cần stack docker đang chạy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geolife", "src/geolife_api"]
